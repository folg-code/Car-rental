name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SECRET_KEY: ci-only-secret-key-not-for-production
  DEBUG: "True"
  ALLOWED_HOSTS: localhost,127.0.0.1
  POSTGRES_DB: ci
  POSTGRES_USER: ci
  POSTGRES_PASSWORD: ci
  POSTGRES_HOST: localhost
  POSTGRES_PORT: "5432"

jobs:
  lint-and-test:
    name: Lint, build CSS, test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tailwind CSS
        run: npm run build:css:prod

      - name: Verify CSS artifact is committed-compatible
        run: test -f backend/static/dist/output.css

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check backend

      - name: Ruff format check
        run: ruff format --check backend

      - name: Django system check
        run: python backend/manage.py check

      - name: Pytest
        run: pytest -q

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prod
          push: false
          tags: car-rental:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  backup-restore-selftest:
    name: Backup restore selftest
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run backup/restore roundtrip
        run: |
          chmod +x scripts/backup.sh scripts/restore.sh scripts/backup-restore-selftest.sh
          ./scripts/backup-restore-selftest.sh
