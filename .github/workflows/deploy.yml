name: Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: car-rental

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: ci

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Build Tailwind CSS
        run: |
          npm ci
          npm run build:css:prod

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push

    # secrets.* nie można używać w if: — użyj zmiennej repozytorium ENABLE_DEPLOY=true
    if: vars.ENABLE_DEPLOY == 'true'

    env:
      GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy deployment files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: |
            docker-compose.prod.yml
            deploy/Caddyfile
            scripts/deploy.sh
            .env.example
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Run deployment on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true

          script: |
            set -euo pipefail

            cd "${{ secrets.DEPLOY_PATH }}"

            chmod +x scripts/deploy.sh

            if [ -n "$GHCR_READ_TOKEN" ]; then
              echo "$GHCR_READ_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            fi

            export WEB_IMAGE=ghcr.io/${{ github.repository_owner }}/car-rental:latest

            ./scripts/deploy.sh