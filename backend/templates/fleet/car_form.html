{% extends "base_internal.html" %}

{% block title %}{{ title }}{% endblock %}
{% block page_heading %}{{ title }}{% endblock %}

{% block content %}
<div class="bg-white rounded-lg shadow p-6 max-w-2xl">
    <form method="post" class="space-y-4">
        {% csrf_token %}
        {% for field in form %}
        <div>
            <label for="{{ field.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-1">
                {{ field.label }}
            </label>
            {{ field }}
            {% if field.errors %}
            <p class="text-red-600 text-xs mt-1">{{ field.errors.0 }}</p>
            {% endif %}
        </div>
        {% endfor %}
        <div class="flex gap-3 pt-2">
            <button type="submit" class="bg-black text-white px-4 py-2 rounded text-sm">Zapisz</button>
            <a href="{% if car %}{% url 'fleet:car_detail' car.pk %}{% else %}{% url 'fleet:car_list' %}{% endif %}" class="text-sm text-gray-600 hover:underline self-center">Anuluj</a>
        </div>
    </form>
</div>
<style>
    #{{ form.registration_number.id_for_label }},
    #{{ form.make.id_for_label }},
    input, select, textarea { width: 100%; border: 1px solid #d1d5db; border-radius: 0.375rem; padding: 0.5rem 0.75rem; }
</style>
{% endblock %}
