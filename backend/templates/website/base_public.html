{% load static %}
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Wynajem aut{% endblock %} | Car Rental</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'dist/output.css' %}">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col font-sans antialiased">
    {% include "website/partials/navbar.html" %}

    {% if messages %}
    <div class="site-container pt-4 w-full space-y-2">
        {% for message in messages %}
        <div class="rounded-xl px-4 py-3 text-sm shadow-sm
            {% if message.tags == 'error' %}bg-red-50 text-red-800 border border-red-100
            {% elif message.tags == 'success' %}bg-green-50 text-green-800 border border-green-100
            {% else %}bg-brand-50 text-brand-900 border border-brand-100{% endif %}">
            {{ message }}
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <main class="flex-1">
        {% block content %}{% endblock %}
    </main>

    {% include "website/partials/footer.html" %}

    <a
        href="{% url 'website:consultant' %}"
        class="fixed bottom-6 right-6 z-50 flex items-center gap-2 rounded-full bg-brand-600 px-5 py-3 text-sm font-semibold text-white shadow-lg shadow-brand-600/30 transition-all duration-200 hover:bg-brand-700 hover:scale-105"
        aria-label="Pomoc — chat z asystentem"
    >
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
        </svg>
        Pomoc
    </a>
</body>
</html>
