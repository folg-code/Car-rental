<section class="bg-white border-b border-gray-200">
    <div class="site-container py-12 md:py-16">
        {% if eyebrow %}
        <p class="text-sm font-semibold uppercase tracking-wide text-brand-600 mb-2">{{ eyebrow }}</p>
        {% endif %}
        <h1 class="section-heading">{{ title }}</h1>
        {% if subtitle %}
        <p class="mt-3 text-gray-600 max-w-2xl text-lg">{{ subtitle }}</p>
        {% endif %}
    </div>
</section>
