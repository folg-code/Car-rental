services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: ${WEB_IMAGE:-ghcr.io/folg-code/car-rental:latest}
    restart: unless-stopped
    env_file:
      - .env.production
    command: sh -c "python backend/manage.py migrate --noinput && gunicorn config.wsgi:application --chdir backend --bind 0.0.0.0:8000 --workers 3 --timeout 60"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
      - private_documents_data:/app/private_documents
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=5)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  celery:
    image: ${WEB_IMAGE:-ghcr.io/folg-code/car-rental:latest}
    restart: unless-stopped
    env_file:
      - .env.production
    command: sh -c "cd backend && celery -A config worker -l info --concurrency=2"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_data:/app/media
      - private_documents_data:/app/private_documents
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cd backend && celery -A config inspect ping -d celery@$$HOSTNAME -t 5",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  celery-beat:
    image: ${WEB_IMAGE:-ghcr.io/folg-code/car-rental:latest}
    restart: unless-stopped
    env_file:
      - .env.production
    command: sh -c "cd backend && celery -A config beat -l info"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Brak Caddy w tym stacku — publiczny TLS jest na VPS w /opt/edge
  # (car-rental.filipf.online → web:8000 na sieci car-rental_default).
  # Nie publikuj tu :80/:443 — zabierzesz porty edge i dostaniesz 502.

volumes:
  postgres_data:
  media_data:
  static_data:
  redis_data:
  private_documents_data:
