services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: ${WEB_IMAGE:-ghcr.io/folg-code/car-rental:latest}
    restart: unless-stopped
    env_file:
      - .env.production
    command: >
      sh -c "python backend/manage.py migrate --noinput &&
             gunicorn config.wsgi:application
             --chdir backend
             --bind 0.0.0.0:8000
             --workers 3
             --timeout 60"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  celery:
    image: ${WEB_IMAGE:-ghcr.io/folg-code/car-rental:latest}
    restart: unless-stopped
    env_file:
      - .env.production
    command: celery -A config worker -l info --workdir backend --concurrency=2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - media_data:/app/media
      - private_documents_data:/app/private_documents

  # Odkomentuj po skonfigurowaniu domeny i Caddyfile na VPS.
  # caddy:
  #   image: caddy:2-alpine
