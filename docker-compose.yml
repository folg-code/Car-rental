services:
  db:
    image: postgres:16

    env_file:
      - .env.docker

    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  web:
    build: .

    command: >
      sh -c "uv sync --all-groups &&
      python backend/manage.py runserver 0.0.0.0:8000"

    env_file:
      - .env.docker

    volumes:
      - .:/app
      - venv_cache:/app/.venv

    ports:
      - "8000:8000"

    depends_on:
      - db
      - redis

  celery:
    build: .

    command: >
      sh -c "uv sync --all-groups &&
      cd backend && celery -A config worker -l info"

    env_file:
      - .env.docker

    depends_on:
      - db
      - redis

    volumes:
      - .:/app
      - venv_cache:/app/.venv

  celery-beat:
    build: .

    command: >
      sh -c "uv sync --all-groups &&
      cd backend && celery -A config beat -l info"

    env_file:
      - .env.docker

    depends_on:
      - db
      - redis

    volumes:
      - .:/app
      - venv_cache:/app/.venv

  tailwind:
    image: node:20

    working_dir: /app

    command: sh -c "npm ci && npm run build:css"

    volumes:
      - .:/app

volumes:
  venv_cache: