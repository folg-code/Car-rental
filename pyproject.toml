[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "car-rental"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    "django>=5.2",
    "psycopg[binary]",
    "django-environ",
    "gunicorn>=23.0",
    "Pillow>=10.0",
    "weasyprint>=63.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.9",
    "ruff>=0.11",
    "pre-commit>=4.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-django",
    "pytest-env>=1.1",
    "ruff",
    "pre-commit",
]

# Django: kod w backend/ (PYTHONPATH), nie jako pakiet pip — tylko zależności z [project].
[tool.setuptools]
packages = []

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"backend/config/settings.py" = ["E501"]
"**/migrations/*" = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["backend"]
python_files = ["tests.py", "test_*.py", "*_tests.py"]
testpaths = ["tests", "backend/apps"]